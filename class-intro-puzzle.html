<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>오늘의 퍼즐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF9F0;
    --coral:#FF6F59;
    --coral-light:#FFDCD3;
    --sky:#3FB6E8;
    --sky-light:#DFF3FC;
    --sun:#FFC94A;
    --ink:#2B2D42;
    --paper:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  header{
    padding:28px 20px 14px;
    text-align:center;
  }
  header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 6px;
    color:var(--coral);
    letter-spacing:-0.5px;
  }
  header p{
    margin:0;
    font-size:15px;
    color:#6b6d80;
  }

  /* ---------- Upload screen ---------- */
  #uploadScreen{
    max-width:480px;
    margin:30px auto;
    padding:0 20px;
  }
  .card{
    background:var(--paper);
    border-radius:22px;
    padding:28px 24px;
    box-shadow:0 10px 0 var(--coral-light);
    border:3px solid var(--coral-light);
    text-align:center;
  }
  .dropzone{
    border:3px dashed var(--sky);
    border-radius:16px;
    padding:34px 16px;
    background:var(--sky-light);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .dropzone:active{transform:scale(0.98);}
  .dropzone .icon{font-size:40px;display:block;margin-bottom:8px;}
  .dropzone span{font-weight:700;color:var(--ink);}
  .dropzone small{display:block;margin-top:4px;color:#7a7c90;font-size:13px;}
  #fileInput{display:none;}

  /* ---------- Setup (difficulty) ---------- */
  #setupScreen{display:none;max-width:600px;margin:24px auto;padding:0 20px;}
  #previewThumb{
    width:100%;
    max-height:520px;
    object-fit:contain;
    border-radius:14px;
    border:3px solid var(--coral-light);
    background:#fff;
    margin-bottom:16px;
  }
  .diffRow{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .diffBtn{
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:15px;
    padding:12px 18px;
    border-radius:14px;
    border:3px solid var(--sky-light);
    background:var(--sky-light);
    color:var(--ink);
    cursor:pointer;
  }
  .diffBtn.active{
    background:var(--sky);
    border-color:var(--sky);
    color:#fff;
  }
  .bigBtn{
    width:100%;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:18px;
    padding:14px;
    border-radius:16px;
    border:none;
    background:var(--coral);
    color:#fff;
    cursor:pointer;
    box-shadow:0 6px 0 #d4523f;
  }
  .bigBtn:active{transform:translateY(4px);box-shadow:none;}
  .linkBtn{
    background:none;border:none;color:#8a8ca0;font-size:14px;
    text-decoration:underline;cursor:pointer;margin-top:12px;
  }

  /* ---------- Puzzle screen ---------- */
  #puzzleScreen{display:none;}
  .toolbar{
    max-width:1000px;margin:0 auto;padding:0 16px 8px;
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  }
  .toolbar button{
    font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;
    padding:9px 16px;border-radius:12px;border:none;cursor:pointer;
    background:var(--sun);color:var(--ink);
  }
  .toolbar button.secondary{background:#fff;border:2px solid #e7e5da;}
  #progressLabel{font-weight:800;color:var(--coral);font-size:15px;}

  #playfield{
    position:relative;
    max-width:1000px;
    margin:10px auto 60px;
    padding:0 16px;
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }
  #boardZone{
    position:relative;
    background:repeating-linear-gradient(45deg, #fff, #fff 10px, #FFFBF5 10px, #FFFBF5 20px);
    border:4px dashed var(--coral);
    border-radius:18px;
    flex-shrink:0;
  }
  #trayZone{
    position:relative;
    flex:1 1 280px;
    min-width:260px;
    min-height:260px;
    background:var(--sky-light);
    border-radius:18px;
    border:3px solid #cdeaf7;
  }
  .slot{
    position:absolute;
    border:2px dashed #ffc3b5;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffb7a4;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    pointer-events:none;
  }
  .piece{
    position:absolute;
    background-repeat:no-repeat;
    border-radius:6px;
    box-shadow:0 4px 8px rgba(0,0,0,0.18);
    border:2px solid #fff;
    cursor:grab;
    touch-action:none;
    z-index:5;
  }
  .piece.dragging{
    cursor:grabbing;
    z-index:50;
    box-shadow:0 10px 18px rgba(0,0,0,0.28);
  }
  .piece.locked{
    cursor:default;
    box-shadow:none;
    border:2px solid transparent;
    border-radius:0;
    z-index:2;
  }
  .badge{
    position:absolute;
    top:-8px;
    left:-8px;
    width:22px;height:22px;
    background:var(--coral);
    color:#fff;
    border-radius:50%;
    font-family:'Baloo 2',sans-serif;
    font-size:12px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #fff;
    pointer-events:none;
  }
  .piece.locked .badge{background:#8fd18f;}

  #celebrate{
    display:none;
    position:fixed;
    z-index:200;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:16px;
    background:transparent;
    pointer-events:none;
  }
  #celebrate .box{
    background:#fff;border-radius:22px;padding:18px 20px;text-align:center;
    max-width:90%;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    pointer-events:auto;
  }
  #celebrate h2{font-family:'Baloo 2',sans-serif;color:var(--coral);margin:0 0 8px;font-size:26px;}
  #celebrate p{margin:0 0 18px;color:#666;}
  .confetti{
    position:fixed;top:-30px;font-size:26px;z-index:199;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(360deg);opacity:0.9;}
  }

  #hintOverlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(43,45,66,0.65);
    align-items:center;justify-content:center;
    z-index:300;
  }
  #hintOverlay img{
    max-width:85vw;
    max-height:85vh;
    border-radius:16px;
    border:5px solid #fff;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }

  @media (max-width:640px){
    #playfield{flex-direction:column;align-items:center;}
    #trayZone{width:100%;}
  }
</style>
</head>
<body>

<header>
  <h1>오늘의 책</h1>
  <p>오늘 함께 읽을 책표지 퍼즐이에요</p>
</header>

<!-- Upload screen -->
<div id="uploadScreen">
  <div class="card">
    <label class="dropzone" for="fileInput">
      <span class="icon">🖼️</span>
      <span>여기를 눌러 사진 올리기</span>
      <small>오늘 수업과 어울리는 사진 한 장을 골라주세요</small>
    </label>
    <input id="fileInput" type="file" accept="image/*">
  </div>
</div>

<!-- Setup screen -->
<div id="setupScreen">
  <div class="card">
    <img id="previewThumb" alt="선택한 사진 미리보기">
    <div class="diffRow" id="diffRow">
      <button class="diffBtn" data-size="3">쉬움 · 9조각</button>
      <button class="diffBtn" data-size="4">보통 · 16조각</button>
      <button class="diffBtn" data-size="5">어려움 · 25조각</button>
    </div>
    <button class="bigBtn" id="startBtn">퍼즐 시작하기</button>
  </div>
</div>

<!-- Puzzle screen -->
<div id="puzzleScreen">
  <div class="toolbar">
    <span id="progressLabel">0 / 0 맞춤</span>
    <button id="hintBtn">👀 힌트보기</button>
    <button id="shuffleBtn">🔀 다시 섞기</button>
    <button class="secondary" id="changeDiffBtn">🎚 난이도 바꾸기</button>
  </div>
  <div id="playfield">
    <div id="boardZone"></div>
    <div id="trayZone"></div>
  </div>
</div>

<div id="celebrate">
  <div class="box">
    <h2>짝짝짝! 완성했어요 🎉</h2>
    <p>표지를 꼼꼼히 보고, 질문을 만들어 보세요.<br>예) 케이크를 먹을 때 포크와 숟가락 중 어떤 게 더 좋을까?</p>
    <button class="bigBtn" id="celebrateCloseBtn">확인</button>
  </div>
</div>

<div id="hintOverlay">
  <img id="hintImg" alt="원본 그림">
</div>

  const fileInput = document.getElementById('fileInput');
  const uploadScreen = document.getElementById('uploadScreen');
  const setupScreen = document.getElementById('setupScreen');
  const puzzleScreen = document.getElementById('puzzleScreen');
  const previewThumb = document.getElementById('previewThumb');
  const diffRow = document.getElementById('diffRow');
  const startBtn = document.getElementById('startBtn');
  const changeDiffBtn = document.getElementById('changeDiffBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const progressLabel = document.getElementById('progressLabel');
  const playfield = document.getElementById('playfield');
  const boardZone = document.getElementById('boardZone');
  const trayZone = document.getElementById('trayZone');
  const celebrate = document.getElementById('celebrate');
  const celebrateCloseBtn = document.getElementById('celebrateCloseBtn');
  const hintBtn = document.getElementById('hintBtn');
  const hintOverlay = document.getElementById('hintOverlay');
  const hintImg = document.getElementById('hintImg');
  let hintTimer = null;

  let imgDataUrl = DEFAULT_IMAGE;
  let gridSize = 3;
  let displayW = 0, displayH = 0;
  let pieceW = 0, pieceH = 0;
  let pieces = []; // {row,col,el,locked,fx,fy}
  let placedCount = 0;

  function showScreen(name){
    uploadScreen.style.display = name==='upload' ? 'block':'none';
    setupScreen.style.display = name==='setup' ? 'block':'none';
    puzzleScreen.style.display = name==='puzzle' ? 'block':'none';
  }

  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      imgDataUrl = ev.target.result;
      previewThumb.src = imgDataUrl;
      showScreen('setup');
    };
    reader.readAsDataURL(file);
  });

  diffRow.addEventListener('click', (e)=>{
    const btn = e.target.closest('.diffBtn');
    if(!btn) return;
    [...diffRow.children].forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    gridSize = parseInt(btn.dataset.size,10);
  });
  diffRow.children[0].classList.add('active');

  changeDiffBtn.addEventListener('click', ()=>{
    showScreen('setup');
  });

  startBtn.addEventListener('click', ()=>{
    showScreen('puzzle');
    requestAnimationFrame(buildPuzzle);
  });

  shuffleBtn.addEventListener('click', ()=>{
    scatterUnlockedPieces();
  });

  celebrateCloseBtn.addEventListener('click', ()=>{
    celebrate.style.display='none';
  });

  hintBtn.addEventListener('click', ()=>{
    hintImg.src = imgDataUrl;
    hintOverlay.style.display='flex';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(()=>{
      hintOverlay.style.display='none';
    }, 3000);
  });

  function computeDisplaySize(naturalW, naturalH){
    const isMobile = window.innerWidth < 640;
    const maxW = isMobile ? Math.min(window.innerWidth - 48, 380) : 460;
    const maxH = 460;
    let w = naturalW, h = naturalH;
    const ratio = Math.min(maxW/w, maxH/h, 1);
    w = Math.round(w*ratio* (naturalW>maxW||naturalH>maxH?1:Math.min(maxW/naturalW,1)) );
    // simpler: scale to fit within maxW/maxH box, upscale small images too
    const scale = Math.min(maxW/naturalW, maxH/naturalH);
    return { w: Math.round(naturalW*scale), h: Math.round(naturalH*scale) };
  }

  function buildPuzzle(){
    const img = new Image();
    img.onload = ()=>{
      const size = computeDisplaySize(img.naturalWidth, img.naturalHeight);
      displayW = size.w; displayH = size.h;
      pieceW = displayW / gridSize;
      pieceH = displayH / gridSize;

      boardZone.style.width = displayW + 'px';
      boardZone.style.height = displayH + 'px';
      boardZone.style.border = '4px dashed var(--coral)';
      boardZone.innerHTML = '';

      trayZone.style.minHeight = Math.max(displayH, 260) + 'px';
      trayZone.innerHTML = '';

      // remove old pieces
      pieces.forEach(p=>p.el.remove());
      pieces = [];
      placedCount = 0;

      // draw slots
      for(let r=0;r<gridSize;r++){
        for(let c=0;c<gridSize;c++){
          const slot = document.createElement('div');
          slot.className='slot';
          slot.style.width = pieceW+'px';
          slot.style.height = pieceH+'px';
          slot.style.left = (c*pieceW)+'px';
          slot.style.top = (r*pieceH)+'px';
          boardZone.appendChild(slot);
        }
      }

      // build piece list
      let idx=1;
      const list = [];
      for(let r=0;r<gridSize;r++){
        for(let c=0;c<gridSize;c++){
          list.push({row:r, col:c, number: idx});
          idx++;
        }
      }
      // shuffle
      for(let i=list.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [list[i],list[j]] = [list[j],list[i]];
      }

      requestAnimationFrame(()=>{
        const playfieldRect = playfield.getBoundingClientRect();
        const boardRect = boardZone.getBoundingClientRect();
        const trayRect = trayZone.getBoundingClientRect();
        const boardOriginX = boardRect.left - playfieldRect.left;
        const boardOriginY = boardRect.top - playfieldRect.top;
        const trayOriginX = trayRect.left - playfieldRect.left;
        const trayOriginY = trayRect.top - playfieldRect.top;

        list.forEach((item)=>{
          const el = document.createElement('div');
          el.className='piece';
          const w = pieceW, h = pieceH;
          el.style.width = w+'px';
          el.style.height = h+'px';
          el.style.backgroundImage = `url(${imgDataUrl})`;
          el.style.backgroundSize = displayW+'px ' + displayH+'px';
          el.style.backgroundPosition = `-${item.col*pieceW}px -${item.row*pieceH}px`;

          // random scatter inside tray
          const maxX = Math.max(trayRect.width - w - 10, 10);
          const maxY = Math.max(trayRect.height - h - 10, 10);
          const startX = trayOriginX + 5 + Math.random()*maxX;
          const startY = trayOriginY + 5 + Math.random()*maxY;
          el.style.left = startX+'px';
          el.style.top = startY+'px';
          el.style.transform = `rotate(${(Math.random()*16-8).toFixed(1)}deg)`;

          playfield.appendChild(el);

          const pieceObj = {
            row:item.row, col:item.col, el, locked:false,
            correctX: boardOriginX + item.col*pieceW,
            correctY: boardOriginY + item.row*pieceH
          };
          pieces.push(pieceObj);
          attachDrag(pieceObj);
        });

        updateProgress();
      });
    };
    img.src = imgDataUrl;
  }

  function scatterUnlockedPieces(){
    const playfieldRect = playfield.getBoundingClientRect();
    const trayRect = trayZone.getBoundingClientRect();
    const trayOriginX = trayRect.left - playfieldRect.left;
    const trayOriginY = trayRect.top - playfieldRect.top;
    pieces.filter(p=>!p.locked).forEach(p=>{
      const w = p.el.offsetWidth, h = p.el.offsetHeight;
      const maxX = Math.max(trayRect.width - w - 10, 10);
      const maxY = Math.max(trayRect.height - h - 10, 10);
      p.el.style.left = (trayOriginX + 5 + Math.random()*maxX)+'px';
      p.el.style.top = (trayOriginY + 5 + Math.random()*maxY)+'px';
      p.el.style.transform = `rotate(${(Math.random()*16-8).toFixed(1)}deg)`;
    });
  }

  function updateProgress(){
    progressLabel.textContent = `${placedCount} / ${pieces.length} 맞춤`;
    if(pieces.length>0 && placedCount === pieces.length){
      boardZone.style.border = 'none';
      launchCelebration();
    }
  }

  function launchCelebration(){
    setTimeout(()=>{
      const rect = boardZone.getBoundingClientRect();
      celebrate.style.left = rect.left+'px';
      celebrate.style.top = rect.top+'px';
      celebrate.style.width = rect.width+'px';
      celebrate.style.height = rect.height+'px';
      celebrate.style.display='flex';
      const emojis = ['🎉','⭐','🎈','✨','🥳'];
      for(let i=0;i<24;i++){
        const c = document.createElement('div');
        c.className='confetti';
        c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        c.style.left = Math.random()*100+'vw';
        c.style.animationDuration = (2+Math.random()*1.5)+'s';
        document.body.appendChild(c);
        setTimeout(()=>c.remove(), 4000);
      }
    }, 700);
  }

  function attachDrag(pieceObj){
    const el = pieceObj.el;
    let dragging = false;
    let offsetX=0, offsetY=0;

    el.addEventListener('pointerdown', (e)=>{
      if(pieceObj.locked) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      const rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      el.style.transform = 'none';
    });

    el.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const playfieldRect = playfield.getBoundingClientRect();
      let x = e.clientX - playfieldRect.left - offsetX;
      let y = e.clientY - playfieldRect.top - offsetY;
      el.style.left = x+'px';
      el.style.top = y+'px';
    });

    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const playfieldRect = playfield.getBoundingClientRect();
      const curX = parseFloat(el.style.left);
      const curY = parseFloat(el.style.top);
      const dx = curX - pieceObj.correctX;
      const dy = curY - pieceObj.correctY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const threshold = Math.min(pieceW, pieceH) * 0.35;
      if(dist < threshold){
        el.style.left = pieceObj.correctX + 'px';
        el.style.top = pieceObj.correctY + 'px';
        el.classList.add('locked');
        pieceObj.locked = true;
        placedCount++;
        updateProgress();
      }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  // 기본 이미지(우리가 케이크를 먹는 방법 표지)를 미리 불러와 바로 시작할 수 있게 함
  previewThumb.src = imgDataUrl;
  showScreen('setup');

  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      if(puzzleScreen.style.display==='block' && pieces.length){
        buildPuzzle();
      }
    }, 300);
  });
})();
</script>
