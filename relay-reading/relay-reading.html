<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>릴레이 낭독 | 복숭아숲도서관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EF;
    --cream-deep:#FCEFDD;
    --ink:#3A3226;
    --ink-soft:#6E6355;
    --pine:#2F4A3C;
    --pine-deep:#22362B;
    --peach:#FFB088;
    --peach-deep:#F2895C;
    --peach-text:#7A3517;
    --card:#FFFFFF;
    --border:#EFE2CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    line-height:1.6;
  }
  h1,h2,h3,.jua{font-family:'Jua', sans-serif; font-weight:400;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    background:var(--cream);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
  }
  .topbar a.back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--pine);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
  }
  .topbar .brand{
    font-family:'Jua', sans-serif;
    font-size:16px;
    color:var(--peach-text);
  }

  .hero{
    background:var(--pine);
    color:#F6F1E4;
    padding:56px 24px 64px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:36px;
    background:var(--cream);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .hero-badge{
    display:inline-block;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.35);
    color:#FFE8D6;
    font-size:13px;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .hero h1{
    font-size:38px;
    margin:0 0 14px;
    letter-spacing:0.5px;
  }
  .hero p{
    font-size:18px;
    color:#E4DFCF;
    max-width:560px;
    margin:0 auto;
  }
  .hero-stats{
    display:flex;
    justify-content:center;
    gap:36px;
    margin-top:28px;
    flex-wrap:wrap;
  }
  .hero-stats div{ text-align:center; }
  .hero-stats strong{
    display:block;
    font-family:'Jua', sans-serif;
    font-size:26px;
    color:#FFCBA4;
  }
  .hero-stats span{
    font-size:12px;
    color:#CFC9B8;
  }

  main{
    max-width:1080px;
    margin:0 auto;
    padding:8px 24px 80px;
    position:relative;
    z-index:1;
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin:28px 0 22px;
  }
  .toolbar .count{
    font-size:14px;
    color:var(--ink-soft);
  }
  .search-box{
    position:relative;
  }
  .search-box input{
    font-family:'Gowun Dodum', sans-serif;
    border:1px solid var(--border);
    background:#fff;
    border-radius:999px;
    padding:10px 18px 10px 36px;
    font-size:14px;
    width:220px;
    color:var(--ink);
  }
  .search-box input:focus{
    outline:2px solid var(--peach);
    outline-offset:1px;
  }
  .search-box svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.5;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(128px, 1fr));
    gap:22px 16px;
  }
  .book{
    cursor:pointer;
    border:none;
    background:none;
    padding:0;
    text-align:left;
    font-family:inherit;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .cover-wrap{
    position:relative;
    aspect-ratio:3/4.2;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 3px 0 var(--border);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cover-wrap.landscape{
    aspect-ratio:4.2/3;
  }
  .book:hover .cover-wrap, .book:focus-visible .cover-wrap{
    transform:translateY(-4px);
    box-shadow:0 8px 0 var(--peach);
  }
  .cover-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .play-badge{
    position:absolute;
    right:6px;
    bottom:6px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--peach-deep);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .multi-badge{
    position:absolute;
    left:6px;
    top:6px;
    background:var(--pine);
    color:#FFE8D6;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
  }
  .book-title{
    font-size:13px;
    color:var(--ink);
    line-height:1.35;
  }

  .empty-msg{
    text-align:center;
    padding:60px 0;
    color:var(--ink-soft);
    font-size:15px;
    display:none;
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(58,50,38,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:#fff;
    border-radius:16px;
    max-width:380px;
    width:100%;
    padding:24px;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    background:var(--cream-deep);
    border:none;
    width:30px;
    height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    color:var(--ink-soft);
  }
  .modal h3{
    font-size:19px;
    margin:0 0 4px;
    color:var(--peach-text);
    padding-right:28px;
  }
  .modal .modal-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 16px;
  }
  .reader-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .reader-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 16px;
    text-decoration:none;
    color:var(--ink);
    transition:background 0.15s ease;
  }
  .reader-item:hover{ background:var(--cream); }
  .reader-item .rname{ font-size:14px; font-weight:600; }
  .reader-item .ryear{ font-size:12px; color:var(--ink-soft); }
  .reader-item .rgo{
    background:var(--peach);
    color:var(--peach-text);
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    font-weight:600;
    white-space:nowrap;
  }

  @media (max-width:520px){
    .hero h1{ font-size:28px; }
    .hero-stats{ gap:20px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(102px, 1fr)); gap:16px 10px; }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .search-box input{ width:100%; }
  }
</style>
</head>

<div class="topbar">

      <input type="text" id="searchInput" placeholder="책 제목으로 찾기">

  <div class="grid" id="bookGrid"></div>
  <p class="empty-msg" id="emptyMsg">검색 결과가 없어요.</p>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    <h3 id="modalTitle"></h3>
    <p class="modal-sub" id="modalSub"></p>

</div>

const grid = document.getElementById('bookGrid');
const emptyMsg = document.getElementById('emptyMsg');
const totalReaders = BOOKS.reduce((sum,b)=>sum+b.readers.length,0);

document.getElementById('heroStats').innerHTML = `
  <div><strong>${BOOKS.length}</strong><span>낭독한 책</span></div>
  <div><strong>${totalReaders}</strong><span>낭독 영상</span></div>
`;
document.getElementById('countLabel').textContent = `총 ${BOOKS.length}권`;

function render(list){
  grid.innerHTML = '';
  emptyMsg.style.display = list.length ? 'none' : 'block';
  list.forEach((book, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'book';
    btn.type = 'button';
    btn.innerHTML = `
      <div class="cover-wrap${book.landscape ? ' landscape' : ''}">
        <img src="covers/${book.cover}" alt="${book.title} 표지" loading="lazy">
        ${book.readers.length > 1 ? `<span class="multi-badge">${book.readers.length}명</span>` : ''}
        <span class="play-badge">▶</span>
      </div>
      <span class="book-title">${book.title}</span>
    `;
    btn.addEventListener('click', ()=> openBook(book));
    grid.appendChild(btn);
  });
}

function openBook(book){
  if(book.readers.length === 1){
    window.open(book.readers[0].url, '_blank', 'noopener');
    return;
  }
  document.getElementById('modalTitle').textContent = book.title;
  document.getElementById('modalSub').textContent = '누가 낭독한 영상을 볼까요?';
  const list = document.getElementById('readerList');
  list.innerHTML = '';
  book.readers.forEach(r=>{
    const a = document.createElement('a');
    a.className = 'reader-item';
    a.href = r.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `
      <span>
        <span class="rname">${r.name}</span><br>
        <span class="ryear">${r.year}년</span>
      </span>
      <span class="rgo">보기</span>
    `;
    list.appendChild(a);
  });
  document.getElementById('overlay').classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') e.currentTarget.classList.remove('open');
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim();
  const filtered = q ? BOOKS.filter(b=>b.title.includes(q)) : BOOKS;
  render(filtered);
});

render(BOOKS);
</script>
</body>
</html>
